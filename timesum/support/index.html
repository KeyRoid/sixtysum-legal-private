<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Support</title>
  <meta name="description" content="Support contact page for TimeSum.">
  <style>
    :root { color-scheme: light; --bg: #f7f8fb; --paper: #ffffff; --text: #17202a; --muted: #667085; --line: #d9dee8; --accent: #1268d6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, #eaf2ff 0, transparent 32rem), var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; line-height: 1.75; }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
    article { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: clamp(24px, 5vw, 44px); box-shadow: 0 20px 60px rgba(20, 30, 50, 0.08); }
    h1 { font-size: clamp(30px, 5vw, 42px); line-height: 1.2; margin: 0 0 18px; }
    h2 { font-size: clamp(20px, 3vw, 26px); line-height: 1.3; margin-top: 34px; }
    p { margin: 14px 0; }
    a { color: var(--accent); font-weight: 700; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .footer { color: var(--muted); font-size: 13px; margin-top: 32px; }
    @media (max-width: 640px) { main { width: min(100% - 20px, 760px); padding-top: 18px; } article { border-radius: 16px; padding: 22px 18px; } }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>Support</h1>
      <p class="meta">TimeSum - 60-base Calculator</p>

      <p>For questions, bug reports, or feedback about this app, please contact us by email.</p>
      <p>Email: <a href="mailto:keyroid.ai@gmail.com">keyroid.ai@gmail.com</a></p>

      <h2>サポート</h2>
      <p>アプリに関する不具合報告・ご質問・ご要望は、以下のメールアドレスまでご連絡ください。</p>
      <p>Email: <a href="mailto:keyroid.ai@gmail.com">keyroid.ai@gmail.com</a></p>

      <p class="footer">© KENTA OSAWA</p>
    </article>
  </main>
</body>
</html>
